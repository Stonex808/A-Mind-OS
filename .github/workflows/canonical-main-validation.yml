name: Canonical Main Validation

on:
  push:
    branches:
      - validation/canonical-main-audit-2026-08-17
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Run orchestrator and harness tests
        run: python -m unittest discover -s services/orchestrator -p 'test*.py' -v
      - name: Run python_core tests
        run: python -m unittest discover -s python_core/tests -p 'test*.py' -v
      - name: Verify canonical source gate blocks exactly as designed
        shell: bash
        run: |
          set +e
          output=$(python tools/project-state/scripts/check_canonical_sources.py 2>&1)
          code=$?
          set -e
          echo "$output"
          test "$code" -eq 2
          grep -q 'governance/01_AUTHORITY_MATRIX.yaml' <<< "$output"
          grep -q 'governance/02_PROJECT_REGISTRY.yaml' <<< "$output"
