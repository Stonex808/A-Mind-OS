name: Project State Canonical Source Gate

on:
  workflow_dispatch:

jobs:
  require-complete-canonical-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Reject missing or partial Matrix and Registry
        run: python tools/project-state/scripts/check_canonical_sources.py
